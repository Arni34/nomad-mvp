<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOMAD — спутниковый мессенджер</title>
<meta name="description" content="NOMAD: мессенджер без интернета через спутники Iridium. E2E-шифрование, работа с модемом RockBLOCK через Web Serial и демо-симулятор спутниковой сети.">
<meta name="theme-color" content="#0B1424">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script type="module" src="src/app.js"></script>
</head>
<body data-view="phone">
<header class="top">
  <h1>NOMAD <span class="tag" id="modeTag">спутник</span></h1>
  <p>Мессенджер через спутники Iridium: ни интернета, ни сотовых вышек. Сообщения шифруются на устройстве и уходят через модем RockBLOCK по SBD. Без модема работает демо-режим: виртуальные модемы и симулятор сети Iridium.</p>
</header>
<main class="grid">
  <section class="devcol">
    <div class="chips" id="chips" role="group" aria-label="Устройства"></div>
    <div class="phone" aria-label="Экран телефона">
      <div class="sb" id="sbar"></div>
      <div id="screen"><div class="center"><p>Загрузка…</p></div></div>
    </div>
  </section>
  <section class="labcol">
    <div class="card skycard skywrap">
      <canvas id="sky" aria-label="Спутники Iridium над устройствами"></canvas>
      <div class="tools" id="skytools"></div>
      <p class="hint" id="skyhint"></p>
    </div>
    <div class="card labtabs">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="session" aria-selected="true">Сеанс</button>
        <button class="tab" role="tab" data-tab="at" aria-selected="false">AT-консоль</button>
        <button class="tab" role="tab" data-tab="net" aria-selected="false">Сеть Iridium</button>
        <button class="tab" role="tab" data-tab="proto" aria-selected="false">Протокол</button>
      </div>
      <div id="labbody"></div>
    </div>
  </section>
</main>
<nav class="mobnav" id="mobnav">
  <button data-view="phone" aria-pressed="true">Телефон</button>
  <button data-view="sky" aria-pressed="false">Спутник</button>
  <button data-view="lab" aria-pressed="false">Сеанс</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">Для работы NOMAD нужен JavaScript.</p></noscript>
</body>
</html>
